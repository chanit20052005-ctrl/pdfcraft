name: OfficePDF Windows build

# Builds the Windows desktop version of this fork (x64) and keeps the portable zip as a
# workflow artifact: unzip it and run pdfcraft.exe, no installation needed.
# Runs by itself after every push to main, and can also be run from the Actions tab.
#
# The MSI that package.ps1 also builds is not kept: its install folder and policy still use the
# ArtCraft suite folder, which a modified version must not use. The build is not code-signed
# (no signing secrets here), so Windows may show "Windows protected your PC" on first start.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: officepdf-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Same craft-fonts commit as ci.yml and release.yml.
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: officepdf-windows-x64
      - uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: "5.0.2"
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: OfficePDF-Windows-x64
          path: dist/release/*-portable.zip
          if-no-files-found: error
